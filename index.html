            <pattern id="str-convolute" width="40" height="20" patternUnits="userSpaceOnUse"><path d="M0,10 C10,0 10,20 20,10 C30,0 30,20 40,10" stroke="#000" stroke-width="1" fill="none" opacity="0.8"/></pattern>
            <pattern id="str-mudcracks" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M2,2 L10,18 L18,2" stroke="#000" stroke-width="1.5" fill="none" /></pattern>
            <pattern id="str-intraclasts" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M5,20 L15,25 L10,15 Z M20,5 L28,8 L25,15 Z" stroke="#000" fill="none" stroke-width="1"/></pattern>
            <pattern id="str-flutes" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M10,18 Q15,5 18,18 M2,18 Q5,5 8,18" stroke="#000" stroke-width="1" fill="none"/></pattern>
            
            <pattern id="str-wavy" width="30" height="15" patternUnits="userSpaceOnUse"><path d="M0,7 Q7,2 15,7 T30,7 M0,12 Q7,7 15,12 T30,12" stroke="#000" stroke-width="1" fill="none" /></pattern>
            <pattern id="str-low_angle" width="40" height="20" patternUnits="userSpaceOnUse"><path d="M0,10 L40,5 M0,20 L40,15" stroke="#000" stroke-width="1" /></pattern>
            <pattern id="str-sigmoidal" width="40" height="30" patternUnits="userSpaceOnUse"><path d="M5,25 C15,25 25,5 35,5" stroke="#000" stroke-width="1" fill="none"/></pattern>
            <pattern id="str-load_casts" width="30" height="15" patternUnits="userSpaceOnUse"><path d="M5,0 Q15,15 25,0" stroke="#000" stroke-width="1" fill="none"/></pattern>
          </defs>
        `;

        // Default state
        const defaultState = {
            projectInfo: { formation: 'Fm. Vaca Muerta', location: 'Perfil 1', date: new Date().toISOString().split('T')[0], geologist: 'Geólogo', scale: '100', notes: '' },
            beds: [
                { id: 1, thickness: 4, category: 'clastic', grainSize: 'clay', contact: 'sharp', description: 'Mdst basal.', lithologies: ['mudstone'], structureMain: 'parallel', structuresSec: [], age: '', group: '', formation: 'Vaca Muerta' },
                { id: 2, thickness: 6, category: 'clastic', grainSize: 'm_sand', contact: 'erosional', description: 'Canal.', lithologies: ['sandstone'], structureMain: 'trough_cross', structuresSec: ['intraclasts'], age: '', group: '', formation: 'Vaca Muerta' }
            ],
            pixelsPerMeter: 40,
            selectedBedId: null,
            sidebarOpen: window.innerWidth > 768,
            activeTab: 'layers',
            viewMode: 'profile'
        };

        // Initialize state
        let state = JSON.parse(JSON.stringify(defaultState));

        // Persistence logic
        function saveLocal() {
            localStorage.setItem('litholog_data_v19', JSON.stringify(state));
        }

        function loadLocal() {
            const data = localStorage.getItem('litholog_data_v19');
            if(data) {
                try {
                    state = JSON.parse(data);
                } catch(e) { console.error("Error loading saved data", e); }
            }
        }

        function resetProject() {
             if(confirm("¿Borrar todo y empezar nuevo proyecto?")) {
                state = JSON.parse(JSON.stringify(defaultState));
                // Update IDs to be unique
                state.beds[0].id = Date.now();
                state.beds[1].id = Date.now() + 1;
                saveLocal();
                renderApp();
             }
        }

        // --- FUNCIONES AUXILIARES ---
        
        function getStratigraphicBlocks(beds, field) {
            const blocks = [];
            if (beds.length === 0) return blocks;
            let currentBlock = { value: beds[0][field], startIndex: 0, endIndex: 0 };
            
            for (let i = 1; i < beds.length; i++) {
                const val = beds[i][field];
                if (val === currentBlock.value) {
                    currentBlock.endIndex = i;
                } else {
                    blocks.push(currentBlock);
                    currentBlock = { value: val, startIndex: i, endIndex: i };
                }
            }
            blocks.push(currentBlock);
            return blocks;
        }

        function getBlockYCoordinates(beds, startIndex, endIndex, pixelsPerMeter, totalHeight) {
            let hBefore = 0;
            for(let i=0; i<startIndex; i++) hBefore += Number(beds[i].thickness);
            
            let hBlock = 0;
            for(let i=startIndex; i<=endIndex; i++) hBlock += Number(beds[i].thickness);
            
            const yBottom = totalHeight - (hBefore * pixelsPerMeter);
            const yTop = yBottom - (hBlock * pixelsPerMeter);
            
            return { yTop, yBottom };
        }

        function getBezierX(t, p0, p1, p2) { return (1-t)*(1-t)*p0 + 2*(1-t)*t*p1 + t*t*p2; }

        function getErosionalStroke(width, y) {
            const waves = 6; const waveW = width / waves; let d = `M ${width} ${y}`;
            for(let i=1; i<=waves; i++) d += ` Q ${width-(i*waveW)+(waveW/2)} ${y+6} ${width-(i*waveW)} ${y}`; 
            return d;
        }

        function getBedOutlinePath(width, yTop, yBottom, index, beds) {
            let d = ``; const nextBed = beds[index+1];
            if (nextBed && nextBed.contact === 'erosional') {
                const waves = 6; const waveW = width / waves;
                d += `M 0 ${yTop}`;
                for(let k=0; k<waves; k++) d += ` Q ${(k*waveW)+(waveW/2)} ${yTop+5} ${(k+1)*waveW} ${yTop}`;
                d += ` L ${width} ${yTop}`;
            } else { d += `M 0 ${yTop} L ${width} ${yTop}`; }
            const bulge = (index % 2 === 0 ? 3 : -2); const controlX = width + bulge;
            d += ` Q ${controlX} ${(yBottom+yTop)/2} ${width} ${yBottom}`;
            if (beds[index].contact === 'erosional' && index !== 0) {
                const waves = 6; const waveW = width / waves;
                for(let k=1; k<=waves; k++) d += ` Q ${width-(k*waveW)+(waveW/2)} ${yBottom+5} ${width-(k*waveW)} ${yBottom}`;
            } else { d += ` L 0 ${yBottom}`; }
            d += ` L 0 ${yTop} Z`; return d;
        }

        function wrapSvgText(text, maxChars) {
            if (!text) return ['']; 
            const words = text.split(' '); 
            let lines = []; 
            let currentLine = words[0];
            for (let i = 1; i < words.length; i++) {
                if (currentLine.length + 1 + words[i].length <= maxChars) {
                    currentLine += " " + words[i]; 
                } else { 
                    lines.push(currentLine); 
                    currentLine = words[i]; 
                }
            } 
            lines.push(currentLine); 
            return lines;
        }

        function toggleHelpModal() { document.getElementById('help-modal').classList.toggle('hidden'); }
        function renderApp() { renderSVG(); renderSidebar(); if(window.lucide) lucide.createIcons(); }

        // --- RENDERIZADO DEL SVG (PERFIL Y LEYENDA) ---
        function renderSVG() {
            const container = document.getElementById('svg-container');
            const totalThickness = state.beds.reduce((acc, b) => acc + Number(b.thickness), 0);
            const columnHeight = totalThickness * state.pixelsPerMeter;
            const headerHeight = 150;
            const footerHeight = 100;
            const svgWidth = 900;
            const bedsStartY = 190;
            const svgHeight = headerHeight + columnHeight + footerHeight + 50; 
            
            const headerSVG = `<g transform="translate(0,0)"><rect x="0" y="0" width="900" height="100" fill="none" stroke="black" stroke-width="2"/><line x1="600" y1="0" x2="600" y2="100" stroke="black" stroke-width="1"/><text x="20" y="35" font-size="24" font-family="serif" font-weight="bold">PERFIL ESTRATIGRÁFICO</text><g transform="translate(20,60)" font-size="12" font-family="sans-serif"><text x="0" y="0" font-weight="bold">Aflor/Fm:</text><text x="70" y="0">${state.projectInfo.formation}</text><text x="0" y="20" font-weight="bold">Loc:</text><text x="40" y="20">${state.projectInfo.location}</text><text x="300" y="0" font-weight="bold">Fecha:</text><text x="350" y="0">${state.projectInfo.date}</text><text x="300" y="20" font-weight="bold">Geo:</text><text x="350" y="20">${state.projectInfo.geologist}</text></g><g transform="translate(620,20)"><text x="0" y="15" font-size="10" font-weight="bold">ESCALA</text><text x="0" y="45" font-size="28" font-weight="bold">1:${state.projectInfo.scale}</text></g></g>`;
            
            const grainScaleClastic = GRAIN_SCALES.clastic.map((g, i) => {
                const prevW = i === 0 ? 0 : GRAIN_SCALES.clastic[i-1].width;
                const center = (prevW + g.width) / 2;
                return `<text x="${center}" y="-5" text-anchor="middle" font-size="8" font-weight="bold" fill="#000">${g.abbr}</text>`;
            }).join('');
            const grainScaleCarb = GRAIN_SCALES.carbonate.map((g, i) => {
                const prevW = i === 0 ? 0 : GRAIN_SCALES.carbonate[i-1].width;
                const center = (prevW + g.width) / 2;
                return `<text x="${center}" y="-25" text-anchor="middle" font-size="8" font-weight="bold" fill="#000">${g.abbr}</text>`;
            }).join('');

            const colHeadersSVG = `
                <g transform="translate(0,130)">
                    <rect x="0" y="0" width="60" height="60" fill="#e5e7eb" stroke="black"/><text x="30" y="35" text-anchor="middle" font-size="10" font-weight="bold">EDAD</text>
                    <rect x="60" y="0" width="50" height="60" fill="#e5e7eb" stroke="black"/><text x="85" y="35" text-anchor="middle" font-size="10" font-weight="bold">GRUPO</text>
                    <rect x="110" y="0" width="70" height="60" fill="#e5e7eb" stroke="black"/><text x="145" y="35" text-anchor="middle" font-size="10" font-weight="bold">FM.</text>
                    
                    <rect x="180" y="0" width="40" height="60" fill="#e5e7eb" stroke="black"/><text x="200" y="35" text-anchor="middle" font-size="10" font-weight="bold">m</text>
                    
                    <rect x="220" y="0" width="260" height="60" fill="#e5e7eb" stroke="black"/>
                    <text x="350" y="15" text-anchor="middle" font-size="10" font-weight="bold">LITOLOGÍA</text>
                    <g transform="translate(220, 60)">${grainScaleClastic}${grainScaleCarb}</g>
                    
                    <rect x="480" y="0" width="80" height="60" fill="#e5e7eb" stroke="black"/><text x="520" y="35" text-anchor="middle" font-size="10" font-weight="bold">EST.</text>
                    <rect x="560" y="0" width="340" height="60" fill="#e5e7eb" stroke="black"/><text x="730" y="35" font-size="10" font-weight="bold" text-anchor="middle">DESCRIPCIÓN</text>
                </g>`;
            
            // --- STRATIGRAPHY BLOCKS RENDER ---
            let stratSVG = '';
            
            const ageBlocks = getStratigraphicBlocks(state.beds, 'age');
            ageBlocks.forEach(b => {
                const {yTop, yBottom} = getBlockYCoordinates(state.beds, b.startIndex, b.endIndex, state.pixelsPerMeter, columnHeight);
                const h = yBottom - yTop;
                stratSVG += `<g transform="translate(0, ${yTop})">
                    <rect x="0" y="0" width="60" height="${h}" fill="white" stroke="black" stroke-width="1"/>
                    <text x="30" y="${h/2}" text-anchor="middle" alignment-baseline="middle" font-size="20" font-weight="bold" transform="rotate(-90 30 ${h/2})">${b.value || ''}</text>
                </g>`;
            });

            const groupBlocks = getStratigraphicBlocks(state.beds, 'group');
            groupBlocks.forEach(b => {
                const {yTop, yBottom} = getBlockYCoordinates(state.beds, b.startIndex, b.endIndex, state.pixelsPerMeter, columnHeight);
                const h = yBottom - yTop;
                stratSVG += `<g transform="translate(60, ${yTop})">
                    <rect x="0" y="0" width="50" height="${h}" fill="white" stroke="black" stroke-width="1"/>
                    <text x="25" y="${h/2}" text-anchor="middle" alignment-baseline="middle" font-size="18" font-weight="bold" transform="rotate(-90 25 ${h/2})">${b.value || ''}</text>
                </g>`;
            });

            const fmBlocks = getStratigraphicBlocks(state.beds, 'formation');
            fmBlocks.forEach(b => {
                const {yTop, yBottom} = getBlockYCoordinates(state.beds, b.startIndex, b.endIndex, state.pixelsPerMeter, columnHeight);
                const h = yBottom - yTop;
                stratSVG += `<g transform="translate(110, ${yTop})">
                    <rect x="0" y="0" width="70" height="${h}" fill="white" stroke="black" stroke-width="1"/>
                    <text x="35" y="${h/2}" text-anchor="middle" alignment-baseline="middle" font-size="15" font-weight="bold" transform="rotate(-90 35 ${h/2})">${b.value || ''}</text>
                </g>`;
            });


            let currentY = columnHeight;
            let bedsSVG = '';
            let clipsDefs = '';
            
            // Offset for lithology column is 220
            
            state.beds.forEach((bed, index) => {
                const hPx = Number(bed.thickness) * state.pixelsPerMeter;
                const yTop = currentY - hPx;
                const yBottom = currentY;
                
                let width = 100; 
                if (bed.category === 'carbonate') width = GRAIN_SCALES.carbonate.find(g => g.id === bed.grainSize)?.width || 100;
                else if (bed.category === 'pyroclastic') width = GRAIN_SCALES.pyroclastic.find(g => g.id === bed.grainSize)?.width || 100;
                else if (bed.category === 'clastic') width = GRAIN_SCALES.clastic.find(g => g.id === bed.grainSize)?.width || 100;
                else width = 250; 

                const clipId = `clip-${bed.id}`;
                const outlinePath = getBedOutlinePath(width, yTop, yBottom, index, state.beds);
                clipsDefs += `<clipPath id="${clipId}"><path d="${outlinePath}"/></clipPath>`;

                const numSlices = Math.max(1, bed.lithologies.length);
                const sliceHeight = hPx / numSlices;
                let layersRender = '';
                bed.lithologies.forEach((lid, idx) => {
                    const l = LITHOLOGIES.find(x => x.id === lid);
                    if (!l) return;
                    const sTop = yTop + (idx * sliceHeight); 
                    layersRender += `<rect x="0" y="${sTop}" width="${width+40}" height="${sliceHeight+1}" fill="${l.color}" stroke="none" />`;
                    if(l.pattern) layersRender += `<rect x="0" y="${sTop}" width="${width+40}" height="${sliceHeight+1}" fill="url(#${l.pattern})" stroke="none" />`;
                });

                if (bed.structureMain && bed.structureMain !== 'none') {
                    const s = STRUCTURES.find(x => x.id === bed.structureMain);
                    if(s && s.pattern) layersRender += `<rect x="0" y="${yTop}" width="${width+40}" height="${hPx}" fill="url(#${s.pattern})" fill-opacity="0.6" stroke="none" style="pointer-events:none" />`;
                }

                let contactPath = `M ${width} ${yBottom} L 0 ${yBottom}`;
                let contactStyle = 'stroke="black" stroke-width="1.5" fill="none"';
                if (index !== 0) {
                    if (bed.contact === 'erosional') contactPath = getErosionalStroke(width, yBottom);
                    else if (bed.contact === 'gradational') contactStyle = 'stroke="black" stroke-width="0.5" fill="none"';
                    else if (bed.contact === 'dashed') contactStyle = 'stroke="black" stroke-width="1.5" stroke-dasharray="5,3" fill="none"';
                }

                const bulge = (index % 2 === 0 ? 3 : -2); const controlX = width + bulge;
                const rightEdgePath = `M ${width} ${yTop} Q ${controlX} ${(yBottom+yTop)/2} ${width} ${yBottom}`;
                const topEdgePath = (index === state.beds.length - 1) ? `M 0 ${yTop} L ${width} ${yTop}` : '';
                const isSelected = bed.id === state.selectedBedId;
                const selectionRect = isSelected ? `<rect x="-5" y="${yTop}" width="5" height="${hPx}" fill="#2563eb" />` : '';
                
                const lithoLabel = bed.lithologies.map(id => LITHOLOGIES.find(l=>l.id===id)?.abbr).join('/');
                const mainStrLabel = bed.structureMain !== 'none' ? STRUCTURES.find(s=>s.id===bed.structureMain)?.abbr : '';
                const labelFinal = lithoLabel + (mainStrLabel ? ` (${mainStrLabel})` : '');

                let secIcons = '';
                if (bed.structuresSec && bed.structuresSec.length > 0) {
                    const startX = 260 + (80 - (bed.structuresSec.length * 22))/2; 
                    bed.structuresSec.forEach((sid, i) => {
                        const s = STRUCTURES.find(x => x.id === sid);
                        if(s?.iconPath) secIcons += `<g transform="translate(${startX + (i*22)}, ${yTop + hPx/2 - 10})"><path d="${s.iconPath}" stroke="black" stroke-width="1.2" fill="none"/></g>`;
                    });
                }
                
                const descLines = wrapSvgText(bed.description, 45); 
                const descSVG = descLines.map((line, i) => `<text x="0" y="${i * 14}" font-size="11" font-family="Arial" fill="#333">${line}</text>`).join('');

                bedsSVG += `
                    <g onclick="selectBed(${bed.id})" class="cursor-pointer hover:opacity-90">
                       <g clip-path="url(#${clipId})">${layersRender}</g>
                       <path d="M 0 ${yBottom} L 0 ${yTop}" stroke="black" stroke-width="1.5" fill="none" />
                       <path d="${rightEdgePath}" stroke="black" stroke-width="1.5" fill="none" />
                       <path d="${topEdgePath}" stroke="black" stroke-width="1.5" fill="none" />
                       <path d="${contactPath}" ${contactStyle} />
                       ${selectionRect}
                       <line x1="260" y1="${yTop}" x2="260" y2="${yBottom}" stroke="#ccc" stroke-width="1" />
                       <line x1="340" y1="${yTop}" x2="340" y2="${yBottom}" stroke="#ccc" stroke-width="1" />
                       ${secIcons}
                       <line x1="340" y1="${yTop}" x2="900" y2="${yTop}" stroke="#ddd" stroke-width="1" />
                       <line x1="900" y1="${yTop}" x2="900" y2="${yBottom}" stroke="black" stroke-width="2" />
                       <g transform="translate(350, ${yTop + 15})">
                           <text x="0" y="0" font-size="12" font-weight="bold" font-family="Arial">${labelFinal}</text>
                           <g transform="translate(0, 14)">${descSVG}</g>
                       </g>
                    </g>
                `;
                currentY -= hPx;
            });

            // Scale track
            let yTicks = `<g transform="translate(220, ${bedsStartY})"><line x1="0" y1="0" x2="0" y2="${columnHeight}" stroke="black" stroke-width="1" />`;
            for(let i=0; i<= Math.ceil(totalThickness); i++) {
                const y = columnHeight - (i * state.pixelsPerMeter);
                if (y >= 0) yTicks += `<g><line x1="-5" y1="${y}" x2="0" y2="${y}" stroke="black" stroke-width="1" /><text x="-8" y="${y}" text-anchor="end" alignment-baseline="middle" font-size="10">${i}</text></g>`;
            }
            yTicks += `</g>`;
            
            const grainGridSVG = GRAIN_SCALES.clastic.map(g => `<line key="${g.id}" x1="${g.width}" y1="0" x2="${g.width}" y2="${columnHeight}" stroke="#eee" stroke-width="1" stroke-dasharray="4 2"/>`).join('');

            const notesLines = wrapSvgText(state.projectInfo.notes || 'Sin notas.', 130);
            const notesSvgText = notesLines.map((line, i) => `<text x="0" y="${35 + (i * 12)}" font-size="10" font-family="Arial" fill="#333">${line}</text>`).join('');
            
            const footerY = bedsStartY + columnHeight + 40;
            const notesSVG = `<g transform="translate(0, ${footerY})"><line x1="0" y1="0" x2="900" y2="0" stroke="black" stroke-width="1"/><text x="0" y="20" font-size="12" font-weight="bold">NOTAS:</text>${notesSvgText}</g>`;

            container.style.width = svgWidth + 'px';
            container.style.height = (footerY + 100) + 'px'; 
            
            if (state.viewMode === 'profile') {
                container.innerHTML = `<svg width="${svgWidth}" height="${footerY + 100}" xmlns="http://www.w3.org/2000/svg" class="bg-white block"><defs>${clipsDefs}</defs>${SVG_DEFS}<g transform="translate(25, 20)">${headerSVG}${colHeadersSVG}<g transform="translate(0, ${bedsStartY})">${stratSVG}</g>${yTicks}<g transform="translate(220, ${bedsStartY})">${grainGridSVG}${bedsSVG}</g>${notesSVG}</g></svg>`;
            } else {
                 // DYNAMIC LEGEND logic
                 const legendWidth = 900; 
                 
                 const usedLithos = new Set(state.beds.flatMap(b => b.lithologies));
                 const usedStructs = new Set(state.beds.flatMap(b => [b.structureMain, ...b.structuresSec]).filter(s => s && s !== 'none'));
                 const usedContacts = new Set(state.beds.map(b => b.contact));

                 const filteredLithos = LITHOLOGIES.filter(l => usedLithos.has(l.id));
                 const filteredStructs = STRUCTURES.filter(s => usedStructs.has(s.id));
                 const filteredContacts = CONTACTS.filter(c => usedContacts.has(c.id));
                 
                 let currentLegendY = 110;
                 
                 let lithoLegendSVG = filteredLithos.map((l, i) => {
                    const x = (i % 3) * 250; const y = Math.floor(i / 3) * 60;
                    return `<g transform="translate(${x}, ${y})"><rect x="0" y="0" width="40" height="40" stroke="black" fill="${l.color}" /><rect x="0" y="0" width="40" height="40" stroke="none" fill="url(#${l.pattern})" /><text x="50" y="15" font-size="12" font-weight="bold">${l.label}</text><text x="50" y="30" font-size="10" fill="gray">${l.abbr}</text></g>`;
                }).join('');
                
                const lithoRows = Math.ceil(filteredLithos.length / 3) || 1;
                const lithoHeight = lithoRows * 60;
                
                const structStartY = currentLegendY + lithoHeight + 40;
                let structLegendSVG = filteredStructs.map((s,i)=>{
                     const x = (i%3)*250; const y = Math.floor(i/3)*60;
                     return `<g transform="translate(${x},${y})"><rect width="40" height="40" stroke="black" fill="white"/><rect width="40" height="40" fill="url(#${s.pattern})" fill-opacity="0.6"/>${s.iconPath ? `<g transform="translate(10,10)"><path d="${s.iconPath}" stroke="black" stroke-width="1.2" fill="none"/></g>` : ''}<text x="50" y="25" font-size="12">${s.label}</text></g>`;
                }).join('');
                const structHeight = (Math.ceil(filteredStructs.length / 3) || 1) * 60;
                
                const contactStartY = structStartY + structHeight + 40;
                let contactsLegendSVG = filteredContacts.map((c, i) => {
                    const x = i * 200;
                    let line = c.id==='erosional' ? '<path d="M0,20 Q10,30 20,20 Q30,10 40,20" stroke="black" stroke-width="1.5" fill="none"/>' : 
                               c.id==='dashed' ? '<line x1="0" y1="20" x2="40" y2="20" stroke="black" stroke-width="1.5" stroke-dasharray="5,3"/>' : 
                               c.id==='gradational' ? '<line x1="0" y1="20" x2="40" y2="20" stroke="black" stroke-width="0.5"/>' : '<line x1="0" y1="20" x2="40" y2="20" stroke="black" stroke-width="1.5"/>';
                    return `<g transform="translate(${x},0)">${line}<text x="50" y="15" font-size="12" font-weight="bold">${c.label}</text></g>`;
                }).join('');
                
                const totalLegendHeight = contactStartY + 100;
                container.style.height = totalLegendHeight + 'px';
                container.innerHTML = `<svg width="${legendWidth}" height="${totalLegendHeight}" xmlns="http://www.w3.org/2000/svg" class="bg-white block">${SVG_DEFS}<g transform="translate(25, 20)"><text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold">REFERENCIAS</text><line x1="100" y1="50" x2="800" y2="50" stroke="black" stroke-width="2"/><text x="50" y="90" font-size="16" font-weight="bold" fill="#374151">LITOLOGÍAS USADAS</text><g transform="translate(50, 110)">${lithoLegendSVG || '<text y="20" fill="gray">Ninguna</text>'}</g><line x1="50" y1="${structStartY-20}" x2="850" y2="${structStartY-20}" stroke="#ddd"/><text x="50" y="${structStartY}" font-size="16" font-weight="bold" fill="#374151">ESTRUCTURAS USADAS</text><g transform="translate(50, ${structStartY+20})">${structLegendSVG || '<text y="20" fill="gray">Ninguna</text>'}</g><line x1="50" y1="${contactStartY-20}" x2="850" y2="${contactStartY-20}" stroke="#ddd"/><text x="50" y="${contactStartY}" font-size="16" font-weight="bold" fill="#374151">CONTACTOS USADOS</text><g transform="translate(50, ${contactStartY+20})">${contactsLegendSVG || '<text y="20" fill="gray">Ninguno</text>'}</g></g></svg>`;
            }
        }

        // --- SIDEBAR RENDER ---
        function renderSidebar() {
            const content = document.getElementById('sidebar-content');
            let html = '';
            
            ['layers', 'project'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if(el) {
                    if (state.activeTab === t) { el.classList.add('border-blue-600', 'text-blue-600'); el.classList.remove('border-transparent', 'text-gray-500'); }
                    else { el.classList.remove('border-blue-600', 'text-blue-600'); el.classList.add('border-transparent', 'text-gray-500'); }
                }
            });

            if (state.activeTab === 'layers') {
                html = `<button onclick="addBed()" class="w-full py-3 bg-slate-800 text-white rounded-lg font-bold flex justify-center items-center gap-2 hover:bg-slate-700 shadow"><i data-lucide="plus"></i> Nueva Capa</button>`;
                const bed = state.beds.find(b => b.id === state.selectedBedId);
                if (bed) {
                    const idx = state.beds.findIndex(b => b.id === state.selectedBedId);
                    
                    const catOptions = ROCK_CATEGORIES.map(c => `<option value="${c.id}" ${bed.category === c.id ? 'selected' : ''}>${c.label}</option>`).join('');
                    
                    const filteredLithos = LITHOLOGIES.filter(l => l.category === bed.category);
                    const selL = (i) => `<select onchange="updateLithoArray(${bed.id}, ${i}, this.value)" class="w-full p-1 border rounded text-xs mb-1"><option value="">(Ninguna)</option>${filteredLithos.map(l => `<option value="${l.id}" ${bed.lithologies[i]===l.id?'selected':''}>${l.label}</option>`).join('')}</select>`;
                    const selS = (i) => `<select onchange="updateStructSecArray(${bed.id}, ${i}, this.value)" class="w-full p-1 border rounded text-xs mb-1"><option value="">(Ninguna)</option>${STRUCTURES.map(s => `<option value="${s.id}" ${bed.structuresSec[i]===s.id?'selected':''}>${s.label}</option>`).join('')}</select>`;
                    
                    let grainSelector = '';
                    if (bed.category === 'clastic' || bed.category === 'carbonate' || bed.category === 'pyroclastic') {
                         let scaleToUse = GRAIN_SCALES.clastic;
                         if(bed.category === 'carbonate') scaleToUse = GRAIN_SCALES.carbonate;
                         if(bed.category === 'pyroclastic') scaleToUse = GRAIN_SCALES.pyroclastic;
                         
                         grainSelector = `<div class="grid grid-cols-4 gap-1">${scaleToUse.map(g => `<button onclick="updateBed(${bed.id},'grainSize','${g.id}')" class="text-[10px] py-1 border rounded ${bed.grainSize===g.id?'bg-slate-800 text-white':'bg-gray-50'}">${g.abbr}</button>`).join('')}</div>`;
                    } else {
                         grainSelector = `<div class="text-[10px] text-gray-400 italic border p-2 rounded bg-gray-50 text-center">Tamaño fijo (Roca Dura)</div>`;
                    }

                    html += `<div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-4 animate-fadeIn">
                        <div class="flex justify-between border-b pb-2"><span class="text-xs font-bold text-blue-600 uppercase">CAPA #${idx + 1}</span><div class="flex gap-1"><button onclick="deleteBed(${bed.id})" class="p-1 text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>
                        
                        <!-- STRATIGRAPHY INPUTS -->
                        <div class="grid grid-cols-3 gap-1 bg-slate-50 p-2 rounded">
                            <div><label class="text-[9px] font-bold text-gray-500">EDAD</label><input type="text" value="${bed.age || ''}" oninput="updateBed(${bed.id},'age',this.value)" class="w-full p-1 border rounded text-xs"/></div>
                            <div><label class="text-[9px] font-bold text-gray-500">GRUPO</label><input type="text" value="${bed.group || ''}" oninput="updateBed(${bed.id},'group',this.value)" class="w-full p-1 border rounded text-xs"/></div>
                            <div><label class="text-[9px] font-bold text-gray-500">FM.</label><input type="text" value="${bed.formation || ''}" oninput="updateBed(${bed.id},'formation',this.value)" class="w-full p-1 border rounded text-xs"/></div>
                        </div>

                        <div class="grid grid-cols-2 gap-2"><div><label class="text-[10px] text-gray-400 font-bold uppercase">Espesor</label><input type="number" step="0.1" value="${bed.thickness}" oninput="updateBed(${bed.id},'thickness',this.value)" class="w-full p-1 border rounded text-sm"/></div><div><label class="text-[10px] text-gray-400 font-bold uppercase">Contacto</label><select onchange="updateBed(${bed.id},'contact',this.value)" class="w-full p-1 border rounded text-xs">${CONTACTS.map(c=>`<option value="${c.id}" ${bed.contact===c.id?'selected':''}>${c.label}</option>`).join('')}</select></div></div>
                        <div><label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase">TIPO DE ROCA</label><select onchange="updateCategory(${bed.id}, this.value)" class="w-full p-1 border rounded text-sm">${catOptions}</select></div>
                        <div><label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase">TEXTURA / GRANO</label>${grainSelector}</div>
                        <div><label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase">Litologías</label>${selL(0)}${selL(1)}${selL(2)}</div>
                        <div><label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase">Estructura</label><select onchange="updateBed(${bed.id},'structureMain',this.value)" class="w-full p-2 border rounded text-sm"><option value="none">Ninguna</option>${STRUCTURES.map(s=>`<option value="${s.id}" ${bed.structureMain===s.id?'selected':''}>${s.label}</option>`).join('')}</select></div>
                        <div><label class="text-[10px] text-gray-400 font-bold block mb-1 uppercase">Símbolos</label>${selS(0)}${selS(1)}${selS(2)}</div>
                        <div><label class="text-[10px] text-gray-400 font-bold mb-1 block uppercase">Descripción</label><textarea oninput="updateBed(${bed.id},'description',this.value)" class="w-full p-2 border rounded text-xs h-20">${bed.description}</textarea></div>
                    </div>`;
                } else html += `<div class="text-center text-gray-400 mt-10"><i data-lucide="file-text" class="mx-auto mb-2 opacity-30 w-8 h-8"></i><p class="text-xs font-bold uppercase tracking-widest">Selecciona una capa</p></div>`;
            } else {
                html = `<div class="space-y-4 animate-fadeIn">
                    <h3 class="font-bold text-gray-700 uppercase tracking-widest text-xs">Datos del Proyecto</h3>
                    <button onclick="resetProject()" class="w-full py-2 bg-red-100 text-red-700 text-xs font-bold rounded border border-red-200">Borrar Todo / Reiniciar</button>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Aflor / Formación</label><input type="text" value="${state.projectInfo.formation}" oninput="updateProject('formation', this.value)" class="w-full p-2 border rounded text-sm shadow-sm"/></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Ubicación</label><input type="text" value="${state.projectInfo.location}" oninput="updateProject('location', this.value)" class="w-full p-2 border rounded text-sm shadow-sm"/></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Fecha</label><input type="date" value="${state.projectInfo.date}" oninput="updateProject('date', this.value)" class="w-full p-2 border rounded text-sm shadow-sm"/></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Geólogo</label><input type="text" value="${state.projectInfo.geologist}" oninput="updateProject('geologist', this.value)" class="w-full p-2 border rounded text-sm shadow-sm"/></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Escala (Texto)</label><input type="text" value="${state.projectInfo.scale}" oninput="updateProject('scale', this.value)" class="w-full p-2 border rounded text-sm shadow-sm"/></div>
                    <div><label class="text-[10px] font-bold text-gray-400 uppercase">Notas Adicionales</label><textarea oninput="updateProject('notes', this.value)" class="w-full p-2 border rounded text-sm shadow-sm h-32">${state.projectInfo.notes || ''}</textarea></div>
                    <div class="pt-4 border-t"><label class="text-xs font-bold text-gray-500 uppercase tracking-widest">Zoom Visual</label><div class="flex items-center gap-2 mt-1"><button onclick="changeZoom(-5)" class="p-1 bg-white border rounded shadow-sm"><i data-lucide="zoom-out"></i></button><span class="text-sm font-mono">${state.pixelsPerMeter}</span><button onclick="changeZoom(5)" class="p-1 bg-white border rounded shadow-sm"><i data-lucide="zoom-in"></i></button></div></div>
                </div>`;
            }
            content.innerHTML = html;
            lucide.createIcons();
            ['layers', 'project'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if (state.activeTab === t) { el.classList.add('border-blue-600', 'text-blue-600'); el.classList.remove('border-transparent', 'text-gray-500'); }
                else { el.classList.remove('border-blue-600', 'text-blue-600'); el.classList.add('border-transparent', 'text-gray-500'); }
            });
        }

        // --- HANDLERS ---
        function toggleHelpModal() { document.getElementById('help-modal').classList.toggle('hidden'); }
        function setActiveTab(t){ state.activeTab=t; renderSidebar(); }
        function setViewMode(m){ state.viewMode=m; renderApp(); }
        function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('translate-x-full'); }
        function selectBed(id){ state.selectedBedId=id; state.activeTab='layers'; renderApp(); }
        
        // SAVE TRIGGER
        function updateProject(f,v){ state.projectInfo[f]=v; saveLocal(); renderSVG(); }
        function changeZoom(d){ state.pixelsPerMeter = Math.max(10, Math.min(100, state.pixelsPerMeter + d)); saveLocal(); renderApp(); }
        
        function addBed(){ 
            const lastBed = state.beds[state.beds.length-1];
            const newBed = { id:Date.now(), thickness:2, category:'clastic', grainSize:'f_sand', lithologies:['sandstone'], structureMain:'none', structuresSec:[], contact:'sharp', description:'Nueva capa...', age: lastBed ? lastBed.age : '', group: lastBed ? lastBed.group : '', formation: lastBed ? lastBed.formation : '' }; 
            state.beds.push(newBed); state.selectedBedId=newBed.id; state.activeTab='layers'; saveLocal(); renderApp(); 
        }
        
        function updateBed(id,f,v){ const b=state.beds.find(x=>x.id===id); if(b){ b[f]=v; saveLocal(); renderSVG(); if(['grainSize','contact','structureMain'].includes(f)) renderSidebar(); } }
        function updateLithoArray(id, idx, val) { const b=state.beds.find(x=>x.id===id); if(b){ if(!b.lithologies) b.lithologies=[]; if(val) b.lithologies[idx]=val; else b.lithologies.splice(idx,1); b.lithologies=b.lithologies.filter(Boolean); if(b.lithologies.length===0) b.lithologies=['mudstone']; saveLocal(); renderApp(); } }
        function updateStructSecArray(id, idx, val) { const b=state.beds.find(x=>x.id===id); if(b){ if(!b.structuresSec) b.structuresSec=[]; if(val) b.structuresSec[idx]=val; else b.structuresSec.splice(idx,1); b.structuresSec=b.structuresSec.filter(Boolean); saveLocal(); renderApp(); } }
        function deleteBed(id){ if(state.beds.length>1){ state.beds=state.beds.filter(b=>b.id!==id); state.selectedBedId=null; saveLocal(); renderApp(); } else alert("Debe haber al menos una capa."); }
        function updateCategory(bedId, newCategory) { const b = state.beds.find(x=>x.id===bedId); if(b){ b.category=newCategory; b.grainSize=(newCategory==='clastic'?'f_sand':(newCategory==='carbonate'?'wackestone':'ash')); b.lithologies=[]; saveLocal(); renderApp(); }}
        
        function exportToPNG(){ const s=document.querySelector('#svg-container svg'); const d=new XMLSerializer().serializeToString(s); const b=new Blob([d],{type:"image/svg+xml;charset=utf-8"}); const u=URL.createObjectURL(b); const i=new Image(); i.onload=()=>{ const c=document.getElementById('export-canvas'); c.width=900; c.height=s.getAttribute('height'); const x=c.getContext('2d'); x.fillStyle="white"; x.fillRect(0,0,c.width,c.height); x.drawImage(i,0,0); const p=c.toDataURL("image/png"); const l=document.createElement("a"); l.href=p; l.download="perfil.png"; l.click(); }; i.src=u; }
        function exportToSVG(){ const s=document.querySelector('#svg-container svg'); const d=new XMLSerializer().serializeToString(s); const b=new Blob([d],{type:"image/svg+xml;charset=utf-8"}); const u=URL.createObjectURL(b); const l=document.createElement("a"); l.href=u; l.download="perfil.svg"; l.click(); }

        window.onload = () => { loadLocal(); renderApp(); };
        let lastWidth = window.innerWidth;
        window.onresize = () => { if(window.innerWidth !== lastWidth) { lastWidth = window.innerWidth; renderSidebar(); } };
    </script>
</body>
</html>
